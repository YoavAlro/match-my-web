<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tweaksy</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon-48.png" width="40" height="40" alt="" />
      <div>
        <h1>Tweaksy</h1>
        <p id="state">Active on this site</p>
      </div>
    </header>
    <p id="site" class="site" title=""></p>
    <main>
      <button id="site-toggle" class="secondary" type="button">Turn off for this site</button>
      <button id="shutdown" class="shutdown" type="button">Shut down Tweaksy</button>
      <button id="open" class="primary" type="button">Open Tweaksy</button>
    </main>
    <p id="status" role="status" aria-live="polite"></p>
    <script src="popup.js"></script>
  </body>
</html>
